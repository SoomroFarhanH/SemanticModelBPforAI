name: Deploy Fabric Integration Decision Guide

on:
  push:
    branches:
      - main
    paths:
      - "Tools/Fabric_Integration_Decision_Guide/**"
      - ".github/workflows/deploy-integration-guide.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: Tools/Fabric_Integration_Decision_Guide
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
